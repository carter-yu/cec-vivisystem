[project]
name = "cec-vivisystem"
version = "0.1.0"
description = "A family vivisystem for Carter, Elaine and Cedric"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client",
    "google-auth",
    "openai",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.2",
    "slack-bolt>=1.30.0",
    "structlog",
]

[project.optional-dependencies]
control = [
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "starlette>=1.9.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cec_vivisystem"]
