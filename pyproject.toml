[project]
name = "cec-vivisystem"
version = "0.1.0"
description = "A family vivisystem for Carter, Elaine and Cedric"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.2",
    "slack-bolt>=1.30.0",
    "structlog",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cec_vivisystem"]
